<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | Shahanaz Super Market</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#08090d;
    color:#fff;
    min-height:100vh;
}


/* =========================================================
   DARK CATEGORIES-STYLE BACKGROUND
========================================================= */

.hero-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;

    background:
        linear-gradient(
            135deg,
            rgba(5,8,15,.96),
            rgba(9,15,25,.88),
            rgba(4,8,14,.96)
        ),
        url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=2200&q=90")
        center/cover no-repeat;

    filter:blur(3px);
    transform:scale(1.04);

    z-index:-2;
}

.hero-overlay{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(233,30,99,.18),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(255,193,7,.08),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            rgba(3,5,10,.2),
            rgba(3,5,10,.82)
        );

    z-index:-1;
    pointer-events:none;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    height:82px;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5vw;

    background:rgba(5,7,12,.58);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.12);

    position:sticky;
    top:0;

    z-index:1000;
}


/* =========================================================
   LOGO
========================================================= */

.logo{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo-icon{
    width:46px;
    height:46px;

    display:grid;
    place-items:center;

    background:#e91e63;

    color:#fff;

    border-radius:12px;

    font-size:22px;
    font-weight:bold;

    box-shadow:
        0 10px 30px rgba(233,30,99,.35);
}

.logo-text h1{
    color:#fff;
    font-size:16px;
    white-space:nowrap;
}

.logo-text span{
    display:block;

    color:#aeb4c0;

    font-size:7px;

    letter-spacing:3px;

    margin-top:4px;
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav-links{
    display:flex;
    align-items:center;
    gap:4px;
}

.nav-links a{
    color:#e9edf5;

    text-decoration:none;

    font-size:8px;

    font-weight:bold;

    padding:11px 13px;

    border-radius:8px;

    transition:.25s;
}

.nav-links a:hover{
    background:rgba(255,255,255,.08);
    color:#ff4081;
}

.nav-links a.active{
    background:#e91e63;
    color:#fff;

    box-shadow:
        0 8px 22px rgba(233,30,99,.25);
}

.nav-links .offer-link{
    color:#ffd54f;
}


/* =========================================================
   MAIN
========================================================= */

.products-page{
    min-height:100vh;

    padding:
        65px 6vw 100px;

    position:relative;
}


/* =========================================================
   HEADER
========================================================= */

.products-header{
    max-width:900px;

    margin:
        0 auto 40px;

    text-align:center;

    color:#fff;

    text-shadow:
        0 2px 15px rgba(0,0,0,.55);
}

.small-title{
    color:#ff4081;

    font-size:10px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:15px;
}

.products-header h2{
    font-size:
        clamp(45px,6vw,72px);

    line-height:.95;

    letter-spacing:-4px;

    margin-bottom:20px;
}

.products-header h2 span{
    color:#ff4081;
}

.products-header p{
    max-width:650px;

    margin:auto;

    color:#c7ccd5;

    font-size:11px;

    line-height:1.8;
}


/* =========================================================
   GLASS CONTENT AREA
========================================================= */

.products-content{
    max-width:1200px;

    margin:0 auto;

    background:
        rgba(12,15,23,.70);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:28px;

    padding:30px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);

    backdrop-filter:blur(18px);

    position:relative;

    z-index:2;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:30px;

    padding:15px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:15px;

    backdrop-filter:blur(15px);
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    width:320px;

    height:45px;

    display:flex;

    align-items:center;

    background:
        rgba(0,0,0,.35);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:10px;

    overflow:hidden;
}

.search-box input{
    flex:1;

    height:100%;

    border:0;

    outline:0;

    padding:0 14px;

    font-size:13px;

    color:#fff;

    background:transparent;
}

.search-box input::placeholder{
    color:#8e949f;
}

.search-box button{
    width:50px;

    height:100%;

    border:0;

    background:#e91e63;

    color:#fff;

    cursor:pointer;

    font-size:16px;

    transition:.25s;
}

.search-box button:hover{
    background:#c2185b;
}


/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:7px;

    flex-wrap:wrap;
}

.filter-btn{
    border:
        1px solid rgba(255,255,255,.13);

    background:
        rgba(255,255,255,.055);

    color:#c9ced8;

    padding:9px 13px;

    border-radius:8px;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.filter-btn:hover{
    border-color:#e91e63;
    color:#ff4081;

    background:
        rgba(233,30,99,.08);
}

.filter-btn.active{
    background:#e91e63;

    border-color:#e91e63;

    color:#fff;

    box-shadow:
        0 7px 20px rgba(233,30,99,.20);
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.products-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:20px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{
    background:
        rgba(255,255,255,.065);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:17px;

    overflow:hidden;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);

    backdrop-filter:blur(12px);

    transition:
        transform .3s,
        box-shadow .3s,
        border-color .3s,
        background .3s;

    cursor:pointer;
}

.product-card:hover{
    transform:translateY(-7px);

    border-color:
        rgba(233,30,99,.50);

    background:
        rgba(255,255,255,.095);

    box-shadow:
        0 18px 45px rgba(0,0,0,.42);
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{
    height:220px;

    position:relative;

    overflow:hidden;

    background:#15171d;
}

.product-image img{
    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .5s;
}

.product-card:hover
.product-image img{
    transform:scale(1.08);
}


/* =========================================================
   IMAGE OVERLAY
========================================================= */

.product-image::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:80px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.55)
        );

    pointer-events:none;
}


/* =========================================================
   BADGE
========================================================= */

.badge{
    position:absolute;

    top:12px;
    left:12px;

    z-index:3;

    padding:7px 10px;

    border-radius:7px;

    background:#e91e63;

    color:#fff;

    font-size:8px;

    font-weight:bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);
}

.badge.yellow{
    background:#ffd54f;

    color:#111;
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
    padding:18px;
}

.product-category{
    color:#ff4081;

    font-size:8px;

    font-weight:bold;

    letter-spacing:2px;

    margin-bottom:8px;
}

.product-info h3{
    color:#fff;

    font-size:17px;

    margin-bottom:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.product-description{
    color:#aeb4bf;

    font-size:10px;

    line-height:1.6;

    min-height:48px;

    margin-bottom:15px;
}


/* =========================================================
   PRICE + BUTTONS
========================================================= */

.product-bottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.price{
    color:#fff;

    font-size:18px;

    font-weight:bold;
}

.price small{
    color:#8d939e;

    font-size:9px;

    font-weight:normal;
}

.card-buttons{
    display:flex;

    gap:6px;
}


/* =========================================================
   VIEW BUTTON
========================================================= */

.view-btn{
    border:
        1px solid rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.06);

    color:#fff;

    text-decoration:none;

    padding:9px 11px;

    border-radius:7px;

    font-size:9px;

    font-weight:bold;

    transition:.25s;
}

.view-btn:hover{
    border-color:#e91e63;

    background:
        rgba(233,30,99,.12);

    color:#ff4081;
}


/* =========================================================
   ADD BUTTON
========================================================= */

.add-btn{
    border:0;

    background:#e91e63;

    color:#fff;

    padding:9px 12px;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    position:relative;

    z-index:10;
}

.add-btn:hover{
    background:#c2185b;

    transform:translateY(-2px);
}

.add-btn.added{
    background:#2e7d32;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:15px;
}

.no-results h3{
    color:#fff;

    font-size:25px;

    margin-bottom:10px;
}

.no-results p{
    color:#8f96a2;

    font-size:12px;
}


/* =========================================================
   CART
========================================================= */

.cart{
    position:fixed;

    right:25px;

    bottom:25px;

    width:62px;

    height:62px;

    border-radius:50%;

    background:#e91e63;

    color:#fff;

    display:grid;

    place-items:center;

    font-size:23px;

    cursor:pointer;

    box-shadow:
        0 12px 35px rgba(233,30,99,.42);

    z-index:2000;

    transition:.25s;
}

.cart:hover{
    transform:scale(1.08);

    background:#c2185b;
}

.cart-count{
    position:absolute;

    top:-3px;
    right:-3px;

    width:22px;
    height:22px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#ffd54f;

    color:#111;

    font-size:9px;

    font-weight:bold;
}


/* =========================================================
   CART MESSAGE
========================================================= */

.cart-message{
    position:fixed;

    right:25px;

    bottom:100px;

    background:
        rgba(8,9,13,.95);

    color:#fff;

    padding:13px 18px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:9px;

    font-size:10px;

    font-weight:bold;

    opacity:0;

    transform:translateY(10px);

    pointer-events:none;

    transition:.25s;

    z-index:3000;
}

.cart-message.show{
    opacity:1;

    transform:translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .products-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .toolbar{
        flex-direction:column;

        align-items:stretch;
    }

    .search-box{
        width:100%;
    }

    .filters{
        justify-content:flex-start;
    }
}


@media(max-width:800px){

    .navbar{
        padding:0 20px;
    }

    .nav-links a{
        padding:8px 7px;

        font-size:7px;
    }

    .products-page{
        padding:
            45px 20px 80px;
    }

    .products-content{
        padding:20px;

        border-radius:20px;
    }

    .products-grid{
        grid-template-columns:
            repeat(2,1fr);
    }
}


@media(max-width:600px){

    .navbar{
        height:70px;
    }

    .logo-icon{
        width:38px;
        height:38px;

        font-size:18px;
    }

    .logo-text h1{
        font-size:11px;
    }

    .logo-text span{
        display:none;
    }

    .nav-links{
        gap:1px;
    }

    .nav-links a{
        font-size:6px;

        padding:6px 4px;
    }

    .products-page{
        padding:
            35px 12px 80px;
    }

    .products-header h2{
        font-size:46px;

        letter-spacing:-3px;
    }

    .products-header p{
        font-size:9px;
    }

    .products-content{
        padding:15px;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .product-image{
        height:250px;
    }

    .cart{
        right:18px;
        bottom:18px;
    }
}


@media(max-width:400px){

    .nav-links a{
        font-size:5px;

        padding:5px 3px;
    }

    .products-header h2{
        font-size:40px;
    }
}

</style>

</head>

/* =========================================================
   CART
========================================================= */

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


/* =========================================================
   ELEMENTS
========================================================= */

const grid =
    document.getElementById("productsGrid");

const searchInput =
    document.getElementById("productSearch");

const cartCount =
    document.getElementById("cartCount");

const cartButton =
    document.getElementById("cartButton");

const cartMessage =
    document.getElementById("cartMessage");


let currentCategory = "ALL";


/* =========================================================
   PRODUCT DETAILS
========================================================= */

function openProductDetails(id){

    window.location.href =
        "products1-details.html?id=" + id;

}


/* =========================================================
   DISPLAY PRODUCTS
========================================================= */

function displayProducts(list){

    grid.innerHTML = "";


    if(list.length === 0){

        grid.innerHTML = `

            <div class="no-results">

                <h3>
                    No Products Found
                </h3>

                <p>
                    Try another product name
                    or choose another category.
                </p>

            </div>

        `;

        return;
    }


    list.forEach(function(product){

        const card =
            document.createElement("article");

        card.className =
            "product-card";


        card.innerHTML = `

            <div
                class="product-image"
                onclick="openProductDetails(${product.id})">

                ${
                    product.badge
                    ?
                    `
                    <div class="badge ${
                        product.yellow
                        ? "yellow"
                        : ""
                    }">

                        ${product.badge}

                    </div>
                    `
                    :
                    ""
                }

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy">

            </div>


            <div class="product-info">

                <div class="product-category">
                    ${product.category}
                </div>


                <h3>
                    ${product.name}
                </h3>


                <p class="product-description">
                    ${product.description}
                </p>


                <div class="product-bottom">


                    <div class="price">

                        ₹${product.price}

                        <small>
                            / ${product.unit}
                        </small>

                    </div>


                    <div class="card-buttons">


                        <a
                            href="./products1-details.html?id=${product.id}"
                            class="view-btn"
                            onclick="event.stopPropagation()">

                            VIEW

                        </a>


                        <button
                            type="button"
                            class="add-btn"
                            onclick="addToCart(${product.id}, this, event)">

                            +

                        </button>


                    </div>

                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            function(event){

                if(
                    event.target.closest(".add-btn") ||
                    event.target.closest(".view-btn")
                ){

                    return;

                }

                openProductDetails(product.id);

            }
        );


        grid.appendChild(card);

    });

}


/* =========================================================
   FILTER
========================================================= */

function filterProducts(category, button){

    currentCategory =
        category;


    document
        .querySelectorAll(".filter-btn")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    button.classList.add("active");


    applyFilters();

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(){

    applyFilters();

}


searchInput.addEventListener(
    "input",
    function(){

        applyFilters();

    }
);


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
        products.filter(function(product){

            const categoryMatch =
                currentCategory === "ALL" ||
                product.category === currentCategory;


            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(search)

                ||

                product.category
                    .toLowerCase()
                    .includes(search);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    displayProducts(filtered);

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(id, button, event){

    if(event){

        event.preventDefault();

        event.stopPropagation();

    }


    const product =
        products.find(function(item){

            return item.id === Number(id);

        });


    if(!product){

        return;

    }


    const existing =
        cart.find(function(item){

            return Number(item.id) ===
                Number(id);

        });


    if(existing){

        existing.quantity =
            Number(existing.quantity || 0) + 1;

    }

    else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            image:product.image,

            unit:product.unit,

            quantity:1

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    updateCartCount();


    button.textContent = "✓";

    button.classList.add("added");


    showCartMessage(
        product.name +
        " added to cart ✓"
    );


    setTimeout(function(){

        button.textContent = "+";

        button.classList.remove("added");

    },1000);

}


/* =========================================================
   CART COUNT
========================================================= */

function updateCartCount(){

    let count = 0;


    cart.forEach(function(item){

        count +=
            Number(item.quantity) || 0;

    });


    cartCount.textContent =
        count;

}


updateCartCount();


/* =========================================================
   CART MESSAGE
========================================================= */

let messageTimer;


function showCartMessage(text){

    cartMessage.textContent =
        text;


    cartMessage.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(function(){

            cartMessage.classList.remove(
                "show"
            );

        },1800);

}


/* =========================================================
   CART PAGE
========================================================= */

cartButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "cart.html";

    }
);


/* =========================================================
   URL SEARCH / CATEGORY
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const urlSearch =
    urlParams.get("search");


const urlCategory =
    urlParams.get("category");


if(urlSearch){

    searchInput.value =
        urlSearch;

}


if(urlCategory){

    const category =
        urlCategory.toUpperCase();


    const validCategories = [

        "ALL",
        "FRUITS",
        "VEGETABLES",
        "DAIRY",
        "BAKERY",
        "SNACKS",
        "BEVERAGES"

    ];


    if(
        validCategories.includes(category)
    ){

        currentCategory =
            category;


        document
            .querySelectorAll(".filter-btn")
            .forEach(function(btn){

                btn.classList.remove(
                    "active"
                );


                if(
                    btn.textContent
                        .trim()
                        .toUpperCase()
                        === category
                ){

                    btn.classList.add(
                        "active"
                    );

                }

            });

    }

}


/* =========================================================
   FIRST LOAD
========================================================= */

applyFilters();

</script>
