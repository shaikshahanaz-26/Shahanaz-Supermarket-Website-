<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#08090d;
    color:#fff;
    min-height:100vh;
}


/* =========================================================
   DARK CATEGORIES / PRODUCTS BACKGROUND
========================================================= */

.hero-bg{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:

        linear-gradient(
            135deg,
            rgba(5,8,15,.96),
            rgba(9,15,25,.88),
            rgba(4,8,14,.96)
        ),

        url("https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&w=2200&q=90")

        center/cover no-repeat;

    filter:blur(3px);

    transform:scale(1.04);

    z-index:-2;
}


.hero-overlay{

    position:fixed;

    inset:0;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(233,30,99,.18),
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(255,193,7,.08),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            rgba(3,5,10,.2),
            rgba(3,5,10,.82)
        );

    z-index:-1;

    pointer-events:none;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{

    height:82px;

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5vw;

    background:rgba(5,7,12,.58);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.12);

    position:sticky;

    top:0;

    z-index:1000;
}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:center;

    gap:11px;
}


.logo-icon{

    width:46px;

    height:46px;

    display:grid;

    place-items:center;

    background:#e91e63;

    color:#fff;

    border-radius:12px;

    font-size:22px;

    font-weight:bold;

    box-shadow:
        0 10px 30px rgba(233,30,99,.35);
}


.logo-text h1{

    color:#fff;

    font-size:16px;

    white-space:nowrap;
}


.logo-text span{

    display:block;

    color:#aeb4c0;

    font-size:7px;

    letter-spacing:3px;

    margin-top:4px;
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav-links{

    display:flex;

    align-items:center;

    gap:4px;
}


.nav-links a{

    color:#e9edf5;

    text-decoration:none;

    font-size:8px;

    font-weight:bold;

    padding:11px 13px;

    border-radius:8px;

    transition:.25s;
}


.nav-links a:hover{

    background:rgba(255,255,255,.08);

    color:#ff4081;
}


.nav-links a.active{

    background:#e91e63;

    color:#fff;

    box-shadow:
        0 8px 22px rgba(233,30,99,.25);
}


.nav-links .offer-link{

    color:#ffd54f;
}


/* =========================================================
   MAIN
========================================================= */

.details-page{

    min-height:100vh;

    padding:
        65px 6vw 100px;
}


/* =========================================================
   HEADER
========================================================= */

.details-header{

    max-width:900px;

    margin:
        0 auto 40px;

    text-align:center;

    color:#fff;

    text-shadow:
        0 2px 15px rgba(0,0,0,.55);
}


.small-title{

    color:#ff4081;

    font-size:10px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:15px;
}


.details-header h2{

    font-size:
        clamp(42px,6vw,70px);

    line-height:.95;

    letter-spacing:-4px;

    margin-bottom:15px;
}


.details-header h2 span{

    color:#ff4081;
}


/* =========================================================
   PRODUCT DETAILS CARD
========================================================= */

.details-card{

    max-width:1200px;

    margin:0 auto;

    background:
        rgba(12,15,23,.70);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:28px;

    padding:30px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:40px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);

    backdrop-filter:blur(18px);

    position:relative;

    z-index:2;
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{

    height:560px;

    position:relative;

    overflow:hidden;

    border-radius:22px;

    background:#15171d;

    border:
        1px solid rgba(255,255,255,.10);
}


.product-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:.5s;
}


.product-image:hover img{

    transform:scale(1.04);
}


/* =========================================================
   IMAGE OVERLAY
========================================================= */

.product-image::after{

    content:"";

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    height:120px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.60)
        );

    pointer-events:none;
}


/* =========================================================
   BADGE
========================================================= */

.badge{

    position:absolute;

    top:18px;

    left:18px;

    z-index:5;

    padding:8px 12px;

    border-radius:8px;

    background:#e91e63;

    color:#fff;

    font-size:9px;

    font-weight:bold;

    box-shadow:
        0 6px 18px rgba(0,0,0,.30);
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.product-info{

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:10px 15px;
}


.product-category{

    color:#ff4081;

    font-size:9px;

    font-weight:bold;

    letter-spacing:3px;

    margin-bottom:12px;
}


.product-info h1{

    font-size:
        clamp(36px,4vw,58px);

    line-height:1.05;

    letter-spacing:-2px;

    margin-bottom:20px;

    color:#fff;
}


.description{

    color:#aeb4bf;

    font-size:13px;

    line-height:1.8;

    max-width:520px;

    margin-bottom:25px;
}


/* =========================================================
   PRICE
========================================================= */

.price{

    display:flex;

    align-items:baseline;

    gap:7px;

    margin-bottom:28px;
}


.price strong{

    font-size:32px;

    color:#fff;
}


.price span{

    color:#8d939e;

    font-size:11px;
}


/* =========================================================
   PRODUCT FEATURES
========================================================= */

.features{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:28px;
}


.feature{

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:12px;

    padding:15px 8px;

    text-align:center;

    backdrop-filter:blur(10px);

    transition:.25s;
}


.feature:hover{

    border-color:
        rgba(233,30,99,.45);

    background:
        rgba(233,30,99,.08);

    transform:translateY(-3px);
}


.feature-icon{

    color:#ff4081;

    font-size:19px;

    margin-bottom:7px;
}


.feature strong{

    display:block;

    color:#fff;

    font-size:9px;
}


.feature span{

    color:#8d939e;

    font-size:8px;
}


/* =========================================================
   QUANTITY
========================================================= */

.quantity-title{

    font-size:10px;

    font-weight:bold;

    color:#e9edf5;

    margin-bottom:8px;
}


.quantity{

    width:135px;

    height:43px;

    display:flex;

    align-items:center;

    border:
        1px solid rgba(255,255,255,.14);

    border-radius:9px;

    overflow:hidden;

    margin-bottom:22px;

    background:
        rgba(255,255,255,.045);
}


.quantity button{

    width:42px;

    height:100%;

    border:0;

    background:
        rgba(255,255,255,.06);

    color:#fff;

    font-size:18px;

    cursor:pointer;

    transition:.25s;
}


.quantity button:hover{

    background:#e91e63;
}


.quantity span{

    flex:1;

    text-align:center;

    color:#fff;

    font-weight:bold;

    font-size:13px;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}


.add-cart{

    border:0;

    background:#e91e63;

    color:#fff;

    padding:14px 25px;

    border-radius:8px;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 8px 22px rgba(233,30,99,.25);
}


.add-cart:hover{

    background:#c2185b;

    transform:translateY(-2px);
}


.back-products{

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.055);

    color:#fff;

    text-decoration:none;

    padding:14px 23px;

    border-radius:8px;

    font-size:10px;

    font-weight:bold;

    transition:.25s;
}


.back-products:hover{

    border-color:#e91e63;

    background:
        rgba(233,30,99,.10);

    color:#ff4081;
}


/* =========================================================
   CART
========================================================= */

.cart{

    position:fixed;

    right:25px;

    bottom:25px;

    width:62px;

    height:62px;

    border-radius:50%;

    background:#e91e63;

    color:#fff;

    display:grid;

    place-items:center;

    font-size:23px;

    cursor:pointer;

    box-shadow:
        0 12px 35px rgba(233,30,99,.42);

    z-index:2000;

    transition:.25s;
}


.cart:hover{

    transform:scale(1.08);

    background:#c2185b;
}


.cart-count{

    position:absolute;

    top:-3px;

    right:-3px;

    width:22px;

    height:22px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#ffd54f;

    color:#111;

    font-size:9px;

    font-weight:bold;
}


/* =========================================================
   MESSAGE
========================================================= */

.cart-message{

    position:fixed;

    right:25px;

    bottom:100px;

    background:
        rgba(8,9,13,.95);

    color:#fff;

    padding:13px 18px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:9px;

    font-size:10px;

    font-weight:bold;

    opacity:0;

    transform:translateY(10px);

    pointer-events:none;

    transition:.25s;

    z-index:3000;
}


.cart-message.show{

    opacity:1;

    transform:translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .details-card{

        grid-template-columns:1fr;

    }

    .product-image{

        height:450px;

    }

}


@media(max-width:600px){

    .navbar{

        height:70px;

        padding:0 15px;
    }

    .logo-icon{

        height:38px;

        font-size:18px;
    }

    .logo-text h1{

        font-size:11px;
    }

    .logo-text span{

        display:none;
    }

    .nav-links{

        gap:1px;
    }

    .nav-links a{

        font-size:6px;

        padding:6px 4px;
    }

    .details-page{

        padding:
            40px 12px 80px;
    }

    .details-card{

        padding:15px;

        border-radius:20px;

        gap:25px;
    }

    .product-image{

        height:330px;

        border-radius:16px;
    }

    .product-info{

        padding:5px;
    }

    .product-info h1{

        font-size:38px;
    }

    .description{

        font-size:11px;
    }

    .features{

        gap:6px;
    }

    .buttons{

        flex-direction:column;
    }

    .add-cart,
    .back-products{

        width:100%;
    }

    .cart{

        right:18px;

        bottom:18px;
    }

}

    {
        id:20,
        name:"Butter Croissant",
        category:"BAKERY",
        price:80,
        unit:"piece",
        image:"https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=1000&q=85",
        badge:"NEW",
        description:"Golden, flaky and freshly baked butter croissant with a delicious rich taste."
    }

];


/* =========================================================
   GET PRODUCT ID
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const productId =
    Number(
        urlParams.get("id")
    );


/* =========================================================
   FIND PRODUCT
========================================================= */

const product =
    products.find(function(item){

        return item.id === productId;

    });


/* =========================================================
   ELEMENTS
========================================================= */

const productImage =
    document.getElementById("productImage");

const productName =
    document.getElementById("productName");

const productCategory =
    document.getElementById("productCategory");

const productDescription =
    document.getElementById("productDescription");

const productPrice =
    document.getElementById("productPrice");

const productUnit =
    document.getElementById("productUnit");

const productBadge =
    document.getElementById("productBadge");

const quantityElement =
    document.getElementById("quantity");

const cartCount =
    document.getElementById("cartCount");

const cartMessage =
    document.getElementById("cartMessage");


/* =========================================================
   QUANTITY
========================================================= */

let quantity = 1;


/* =========================================================
   LOAD PRODUCT
========================================================= */

if(product){

    document.title =
        product.name +
        " | Shahanaz Super Market";


    productImage.src =
        product.image;


    productImage.alt =
        product.name;


    productName.textContent =
        product.name;


    productCategory.textContent =
        product.category;


    productDescription.textContent =
        product.description;


    productPrice.textContent =
        "₹" + product.price;


    productUnit.textContent =
        "/ " + product.unit;


    if(product.badge){

        productBadge.textContent =
            product.badge;

        productBadge.style.display =
            "block";

    }

}


/* =========================================================
   QUANTITY CONTROL
========================================================= */

function changeQuantity(amount){

    quantity += amount;


    if(quantity < 1){

        quantity = 1;

    }


    if(quantity > 20){

        quantity = 20;

    }


    quantityElement.textContent =
        quantity;

}


/* =========================================================
   CART
========================================================= */

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


function updateCartCount(){

    let count = 0;


    cart.forEach(function(item){

        count +=
            Number(item.quantity) || 0;

    });


    cartCount.textContent =
        count;

}


updateCartCount();


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(){

    if(!product){

        return;

    }


    const existing =
        cart.find(function(item){

            return Number(item.id) ===
                   Number(product.id);

        });


    if(existing){

        existing.quantity +=
            quantity;

    }

    else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            image:product.image,

            unit:product.unit,

            quantity:quantity

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    updateCartCount();


    showMessage(
        product.name +
        " added to cart ✓"
    );

}


/* =========================================================
   CART MESSAGE
========================================================= */

let messageTimer;


function showMessage(text){

    cartMessage.textContent =
        text;


    cartMessage.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(function(){

            cartMessage.classList.remove(
                "show"
            );

        },1800);

}


/* =========================================================
   CART BUTTON
========================================================= */

document
    .getElementById("cartButton")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "cart.html";

        }
    );


/* =========================================================
   PRODUCT NOT FOUND
========================================================= */

if(!product){

    productName.textContent =
        "Product Not Found";

    productCategory.textContent =
        "PRODUCT";

    productDescription.textContent =
        "Sorry, this product could not be found.";

    productPrice.textContent =
        "—";

    productImage.src =
        "https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&w=1200&q=85";

}

</script>

</body>
</html>
